name: Release On-Demand

on:
  workflow_dispatch:

concurrency:
  group: release-on-demand
  cancel-in-progress: false

jobs:
  build-and-release:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          submodules: recursive


      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.x'

      - name: Extract Version
        id: version
        run: |
          VERSION=$(grep '#define PKGMGR_VERSION' include/version.h | awk '{print $3}' | tr -d '"' | tr -d '\r')
          if [ -z "$VERSION" ]; then
            echo "Error: Could not find PKGMGR_VERSION in include/version.h"
            exit 1
          fi
          echo "Extracted version: $VERSION"
          echo "tag=v${VERSION}" >> $GITHUB_OUTPUT
          echo "version=${VERSION}" >> $GITHUB_OUTPUT

      - name: Check if release exists
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          if gh release view "$TAG" >/dev/null 2>&1; then
            echo "Release $TAG already exists. Aborting."
            exit 1
          fi
          echo "Release $TAG does not exist. Proceeding."

      - name: Build PKG Manager
        run: |
          chmod +x build_release.sh
          ./build_release.sh
          SHORT_HASH=$(git rev-parse --short HEAD)
          mv "pkg-manager_v${{ steps.version.outputs.version }}-dev-${SHORT_HASH}.elf" \
             "pkg-manager_v${{ steps.version.outputs.version }}.elf"

      - name: Create Release
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TAG="${{ steps.version.outputs.tag }}"
          VERSION="${{ steps.version.outputs.version }}"
          PREV_TAG=$(git describe --tags --abbrev=0 2>/dev/null || echo "")

          TAG="$TAG" PREV_TAG="$PREV_TAG" REPOSITORY="${{ github.repository }}" python3 - <<'PY'
          import os
          from pathlib import Path

          tag = os.environ["TAG"]
          lines = Path("CHANGELOG.md").read_text().splitlines()
          section = []
          found = False
          for line in lines:
              if not found:
                  if line.strip() == f"## {tag}":
                      found = True
                  continue
              if line.startswith("## "):
                  break
              section.append(line)

          changelog = "\n".join(section).strip()
          while changelog.endswith("---"):
              changelog = changelog[:-3].rstrip()

          notes = changelog or f"No exact {tag} section found in CHANGELOG.md."
          previous = os.environ.get("PREV_TAG", "")
          if previous:
              notes += f"\n\nFull Changelog: https://github.com/{os.environ['REPOSITORY']}/compare/{previous}...{tag}"
          Path("release-notes.md").write_text(notes + "\n")
          PY

          gh release create "$TAG" \
            --title "$TAG" \
            --notes-file release-notes.md \
            "pkg-manager_v${VERSION}.elf"

      - name: Update Payload Manager manifest
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          VERSION: ${{ steps.version.outputs.version }}
          REPOSITORY: ${{ github.repository }}
        run: |
          ASSET_NAME="pkg-manager_v${VERSION}.elf"
          RELEASE_TAG="v${VERSION}"
          RELEASE_URL="https://github.com/${REPOSITORY}/releases/download/${RELEASE_TAG}/${ASSET_NAME}"
          ASSET_NAME="$ASSET_NAME" RELEASE_TAG="$RELEASE_TAG" RELEASE_URL="$RELEASE_URL" python3 - <<'PY'
          import hashlib
          import json
          import os
          from datetime import datetime, timezone
          from pathlib import Path

          asset_name = os.environ["ASSET_NAME"]
          asset_path = Path(asset_name)
          if not asset_path.is_file():
              raise SystemExit(f"Release asset not found: {asset_path}")

          with asset_path.open("rb") as asset:
              checksum = hashlib.file_digest(asset, "sha256").hexdigest()

          manifest_path = Path("payloads.json")
          payloads = json.loads(manifest_path.read_text()) if manifest_path.exists() else []
          if not isinstance(payloads, list):
              raise SystemExit("payloads.json must contain a JSON array")

          payload = {
              "name": "PKG-Manager",
              "filename": asset_name,
              "url": os.environ["RELEASE_URL"],
              "source": f"https://github.com/{os.environ['REPOSITORY']}/releases",
              "source_direct": os.environ["RELEASE_URL"],
              "description": "Browse and install PKGs from USB, disc, or SMB shares directly on your PS5",
              "last_update": datetime.now(timezone.utc).strftime("%Y-%m-%d"),
              "version": os.environ["RELEASE_TAG"],
              "category": "Utilities & Tools",
              "checksum": checksum,
          }

          payloads = [item for item in payloads if item.get("name") != payload["name"]]
          payloads.append(payload)
          manifest_path.write_text(json.dumps(payloads, indent=2, ensure_ascii=False) + "\n")
          PY

          git config user.name "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"
          git add payloads.json
          if ! git diff --cached --quiet; then
            git commit -m "Update Payload Manager manifest for v${VERSION}" \
              -m "Co-authored-by: Copilot <223556219+Copilot@users.noreply.github.com>"
            git push origin HEAD:main
          fi
